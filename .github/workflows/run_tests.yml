name: Run `cli_calc` tests
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Set environment variable
        run: source "$HOME/.cargo/env"
      - name: Run tests
        run: cargo test
